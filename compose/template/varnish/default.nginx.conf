## Nginx config for running Magento behind Varnish. Mount it over the nginx
## image's /etc/nginx/conf.d/default.conf to opt in -- see the "Varnish"
## section of the README.
##
## Request flow:
##   browser -> nginx :8443 (TLS) -> varnish :80 -> nginx :8080 -> phpfpm
##
## The :8080 backend stays plain HTTP, so the "X-Forwarded-Proto: https"
## header set below is what tells Magento the original request was secure.
## X-Forwarded-Proto is Magento's default web/secure/offloader_header, so no
## extra configuration is needed for this to work.

upstream fastcgi_phpfpm {
  server unix:/sock/phpfpm.sock;
}

upstream fastcgi_phpfpm_xdebug {
  server unix:/sock/phpfpm-xdebug.sock;
}

map $cookie_XDEBUG_SESSION $fastcgi_backend {
  default fastcgi_phpfpm;
  PHPSTORM fastcgi_phpfpm_xdebug;
}

server {
  listen 8000;
  return 301 https://$host$request_uri;
}

## TLS termination. Requests are handed to Varnish, which either serves them
## from cache or fetches them from the :8080 backend below.
server {
  listen [::]:8443 ssl http2 ipv6only=on;
  listen 8443 ssl http2;

  ssl_certificate /etc/nginx/certs/nginx.crt;
  ssl_certificate_key /etc/nginx/certs/nginx.key;

  ## Docker's embedded DNS server. Resolving the upstream per request instead
  ## of at startup keeps nginx booting when the varnish container isn't up
  ## yet, which matters because varnish in turn resolves "app" when it boots.
  resolver 127.0.0.11 valid=10s ipv6=off;

  ## LiveReload (bin/grunt watch) is a websocket, so it skips Varnish
  location /livereload.js {
    proxy_set_header Host $host;
    proxy_pass http://phpfpm:35729/livereload.js;
  }

  location /livereload {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_pass http://phpfpm:35729/livereload;
  }

  location / {
    set $varnish_backend varnish;
    proxy_pass http://$varnish_backend:80;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";

    ## Magento sends plenty of cookies, so give the response headers room
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    ## Matches .first_byte_timeout in default.vcl, so long-running admin
    ## requests aren't cut short at the proxy
    proxy_connect_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}

## Varnish backend. Not published to the host -- only Varnish talks to it.
server {
  listen 8080;

  set $MAGE_ROOT /var/www/html;

  fastcgi_buffer_size 64k;
  fastcgi_buffers 8 128k;

  include /var/www/html/nginx[.]conf;
}
